<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ShopWave Support</title>
<style>
  :root { --blue:#0069ff; --bg:#f5f7fa; --ink:#1a1f36; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink);
         display:flex; flex-direction:column; height:100vh; }
  header { background:var(--blue); color:#fff; padding:14px 20px; font-weight:600; }
  header small { opacity:.8; font-weight:400; margin-left:8px; }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:72%; padding:10px 14px; border-radius:14px; line-height:1.45; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--blue); color:#fff; border-bottom-right-radius:4px; }
  .agent { align-self:flex-start; background:#fff; border:1px solid #e3e8ef; border-bottom-left-radius:4px; }
  .typing { align-self:flex-start; color:#8792a2; font-style:italic; }
  form { display:flex; gap:8px; padding:14px 20px; background:#fff; border-top:1px solid #e3e8ef; }
  input { flex:1; padding:11px 14px; border:1px solid #cdd5e0; border-radius:10px; font-size:15px; }
  button { padding:11px 20px; background:var(--blue); color:#fff; border:0; border-radius:10px;
           font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; }
</style>
</head>
<body>
<header>ShopWave Support <small>powered by Wavey</small></header>
<div id="chat">
  <div class="msg agent">Hi, I'm Wavey! I can help with order status, shipping, and refunds. What can I do for you?</div>
</div>
<form id="f">
  <input id="box" placeholder="Ask about an order, e.g. 'Where is SW-1002?'" autocomplete="off" />
  <button id="send">Send</button>
</form>
<script>
// Keep the agent key off the client: point this at a tiny proxy route on App
// Platform (e.g. a Function or a /api/chat route) that forwards to
// $AGENT_ENDPOINT/api/v1/chat/completions with the Authorization header added.
const PROXY_URL = "/api/chat";

const chat = document.getElementById("chat");
const box = document.getElementById("box");
const send = document.getElementById("send");
const history = [];

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = box.value.trim();
  if (!text) return;
  box.value = ""; send.disabled = true;
  add("user", text);
  history.push({ role: "user", content: text });
  const t = add("typing", "Wavey is typing...");
  try {
    const r = await fetch(PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });
    const data = await r.json();
    const reply = data.choices?.[0]?.message?.content ?? "(no response)";
    t.remove();
    add("agent", reply);
    history.push({ role: "assistant", content: reply });
  } catch (err) {
    t.remove();
    add("agent", "Sorry, something went wrong reaching support. Please try again.");
  } finally {
    send.disabled = false; box.focus();
  }
});
</script>
</body>
</html>
